aid: vridhihomefinance
name: Vridhi Home Finance
description: 'Vridhi Home Finance (Vridhi Finserv Home Finance Limited) is an affordable
  housing finance company (HFC) headquartered in Bengaluru, India, founded in 2022. Operating
  as a tech-enabled brick-and-mortar lender across tier-2 and tier-3 cities, it provides home
  purchase loans, home construction loans, plot-and-construction loans, balance-transfer and
  top-up loans, and loans against property to salaried and self-employed customers. The company
  is backed by Norwest Venture Partners and Elevation Capital. It operates a public marketing
  website, a customer service portal, a refer-and-earn portal, and an Android mobile app, but
  publishes no public developer API, documentation, or machine-readable API surface.'
